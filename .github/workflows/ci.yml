name: ParkPilot Quality CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Verify Quality Suite (43 Test Cases)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Start MySQL Server
        shell: powershell
        run: |
          Get-Service -Name MySQL* | Start-Service
          Start-Sleep -Seconds 3

      - name: Initialize Database Schema
        shell: powershell
        run: |
          & "C:\Program Files\MySQL\MySQL Server 8.0\bin\mysql.exe" -u root -proot -e "CREATE DATABASE IF NOT EXISTS zhixingyuebo_db CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;"
          & "C:\Program Files\MySQL\MySQL Server 8.0\bin\mysql.exe" -u root -proot zhixingyuebo_db < zhixingyuebo-java/sql/01_create_zhixingyuebo_database_and_tables.sql

      - name: Setup CI Database Configuration
        shell: powershell
        run: |
          $content = @"
          jdbc.url=jdbc:mysql://127.0.0.1:3306/zhixingyuebo_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
          jdbc.username=root
          jdbc.password=root
          "@
          Set-Content -Path zhixingyuebo-java/resources/db.local.properties -Value $content -Encoding utf8

      - name: Execute Strict Compiler Check & Full Verification (43/43 Cases)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\zhixingyuebo-java\verify_tests.ps1 -NoPause
